name: Morning digest

on:
  schedule:
    # 7:07 a.m. America/New_York. GitHub cron is UTC with no DST handling, so
    # both the EDT (11:07 UTC) and EST (12:07 UTC) equivalents are listed; the
    # guard in the script sends only from the cron whose UTC hour is 7 a.m.
    # Eastern today, so a late start still sends. The odd minute avoids the
    # congested top of the hour. Weekdays only (trading days).
    - cron: "7 11 * * 1-5"
    - cron: "7 12 * * 1-5"

concurrency:
  group: morning-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send morning digest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DIGEST_GMAIL_USER: ${{ secrets.DIGEST_GMAIL_USER }}
          DIGEST_GMAIL_APP_PASSWORD: ${{ secrets.DIGEST_GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: npx tsx scripts/run-digest.ts --expect-hour=7 --schedule="$SCHEDULE"
      # A skipped run (wrong cron leg) or a failed send never reaches here, so
      # this only fires after a real digest email went out with fresh scores.
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/last-scan.json; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last-scan.json
          git commit -m "Update digest snapshot"
          git push
