name: Midday digest

on:
  schedule:
    # 12:07 p.m. America/New_York. GitHub cron is UTC with no DST handling, so
    # both the EDT (16:07 UTC) and EST (17:07 UTC) equivalents are listed; the
    # guard in the script sends only from the cron whose UTC hour is noon
    # Eastern today, so a late start still sends. The odd minute avoids the
    # congested top of the hour. Weekdays only (trading days).
    - cron: "7 16 * * 1-5"
    - cron: "7 17 * * 1-5"

concurrency:
  group: midday-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send midday digest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DIGEST_GMAIL_USER: ${{ secrets.DIGEST_GMAIL_USER }}
          DIGEST_GMAIL_APP_PASSWORD: ${{ secrets.DIGEST_GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: npx tsx scripts/run-digest.ts --midday --expect-hour=12 --schedule="$SCHEDULE"
